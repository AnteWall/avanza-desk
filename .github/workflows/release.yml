name: Release

# `just release 1.2.3` bumps package.json (tauri.conf.json reads it from there), tags the commit,
# pushes, then dispatches this workflow on main. It runs on main, not on the tag, because GitHub
# scopes caches by ref: a tag run can't restore another tag's cache, so every build was cold.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          # Oldest supported Ubuntu keeps the AppImage/deb glibc requirement low.
          - os: ubuntu-22.04
            args: ""
            rust-targets: ""
          - os: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff needs the tags and commits since the previous release.
          fetch-depth: 0

      # This version's section of the changelog, for the release page and the updater's notes.
      - name: Release notes
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip all

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf

      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # latest.json takes its version from package.json; a mismatched tag would publish a wrong one.
      - name: Commit is tagged with the package.json version
        shell: bash
        run: git tag --points-at HEAD | grep -qx "v$(node -p 'require("./package.json").version')"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Both macOS targets run on the same runner OS; without this they share one cache key.
          key: ${{ matrix.rust-targets }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: AvanzaDesk v__VERSION__
          releaseBody: |
            ${{ steps.notes.outputs.content }}

            See the assets below to download and install this version.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
