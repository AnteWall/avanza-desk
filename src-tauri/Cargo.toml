[package]
name = "avanza-desk"
version = "0.1.0"
description = "A Tauri App"
authors = ["Ante Wall"]
license = "AGPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "avanza_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip"] }
rusqlite_migration = "2.6.0"
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-notification = "2"
rmcp = { version = "3.8", features = ["server", "transport-streamable-http-server"] }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "time", "net"] }
uuid = { version = "1.29.0", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "block2"] }
block2 = "0.6"
